spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # Register statement inspector for SQL assertion tests
        session_factory:
          statement_inspector: com.fieldservice.app.security.CaptureStatementInspector

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    user: sa
    password:

  # Disable OAuth2 issuer validation in tests — JWT decoder is mocked/overridden
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri:

app:
  pagination:
    cursor-hmac-key: test-hmac-key-for-unit-tests
    offset-threshold: 20
  idempotency:
    enabled: true
    ttl: 24h
    lease-duration: 5s
    max-body-bytes: 262144
    purge-job-enabled: false

ai:
  copilot:
    enabled: false
    daily-cap-per-user: 10
  provider:
    base-url: https://api.example.ai
    api-key: ""
    allowed-hosts:
      - api.example.ai
      - localhost
      - 127.0.0.1

# Disable Redis auto-configuration in tests — cap service uses NoOpUsageCapService
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    com.fieldservice: DEBUG
    org.springframework.security: DEBUG
