# ArchUnit configuration (WO-200)
# Freeze store: violations committed under test resources so exceptions are
# reviewable and diffs are visible in pull requests.
# On first run the store is auto-created; commit the generated files to freeze
# the baseline, then only NEW violations break the build.
freeze.store.default.path=archunit/frozen
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=false
