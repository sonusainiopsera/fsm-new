# Machine-readable RBAC matrix — single source of truth for RbacMatrixTest.
# Every row maps one service-layer operation to its role permission set.
# Changes here must be mirrored in docs/security/rbac-matrix.md and vice versa.
#
# permission values: PERMIT | DENY
# http.testPathParams: concrete UUIDs from fixtures.sql used in integration tests

operations:

  - id: get_work_order_revisions
    description: "Retrieve the Envers revision history for a work order"
    serviceClass: "com.fieldservice.workorder.audit.WorkOrderRevisionService"
    serviceMethod: "getRevisions"
    http:
      method: GET
      path: "/api/v1/work-orders/{workOrderId}/revisions"
      testPathParams:
        workOrderId: "eeeeeeee-0000-0000-0000-000000000001"
    permissions:
      ADMIN:      PERMIT
      MANAGER:    PERMIT
      DISPATCHER: DENY
      TECHNICIAN: DENY
      CUSTOMER:   DENY
    rationale: "Audit trails restricted to ADMIN and MANAGER; field roles must not see change history."

  - id: apply_work_order_transition
    description: "Apply a lifecycle event to a work order"
    serviceClass: "com.fieldservice.workorder.application.WorkOrderTransitionApplicationService"
    serviceMethod: "apply"
    http:
      method: POST
      path: "/api/v1/work-orders/{workOrderId}/transitions"
      testPathParams:
        workOrderId: "eeeeeeee-0000-0000-0000-000000000001"
      testBody: '{"event":"DEPART","expectedVersion":0}'
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: PERMIT
      MANAGER:    PERMIT
      TECHNICIAN: PERMIT
      CUSTOMER:   DENY
    rationale: "Customers have no lifecycle authority; only internal staff may drive state transitions."

  - id: get_user_preference
    description: "Read the authenticated user's appearance preference"
    serviceClass: "com.fieldservice.identity.application.UserPreferencesService"
    serviceMethod: "getPreference"
    http:
      method: GET
      path: "/api/v1/users/me/preferences"
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: PERMIT
      MANAGER:    PERMIT
      TECHNICIAN: PERMIT
      CUSTOMER:   PERMIT
    rationale: "Personal appearance setting; every authenticated role may read their own preference."

  - id: update_user_preference
    description: "Update the authenticated user's appearance preference"
    serviceClass: "com.fieldservice.identity.application.UserPreferencesService"
    serviceMethod: "updatePreference"
    http:
      method: PUT
      path: "/api/v1/users/me/preferences"
      testBody: '{"preference":"DARK"}'
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: PERMIT
      MANAGER:    PERMIT
      TECHNICIAN: PERMIT
      CUSTOMER:   PERMIT
    rationale: "Personal appearance setting; every authenticated role may update their own preference."

  - id: list_work_orders
    description: "Paginated listing of work orders (row-scoped by caller's access scope)"
    serviceClass: "com.fieldservice.workorder.application.WorkOrderQueryApplicationService"
    serviceMethod: "listWorkOrders"
    http:
      method: GET
      path: "/api/v1/work-orders"
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: PERMIT
      MANAGER:    PERMIT
      TECHNICIAN: PERMIT
      CUSTOMER:   PERMIT
    rationale: "All roles may list work orders; row-level scope predicates restrict what each caller actually sees."

  - id: create_work_order
    description: "Create a new work order"
    serviceClass: "com.fieldservice.workorder.application.WorkOrderApplicationService"
    serviceMethod: "createWorkOrder"
    http:
      method: POST
      path: "/api/v1/work-orders"
      testBody: '{"reference":"WO-RBAC-001","priority":"MEDIUM","siteId":"bbbbbbbb-0000-0000-0000-000000000001"}'
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: PERMIT
      MANAGER:    PERMIT
      TECHNICIAN: DENY
      CUSTOMER:   DENY
    rationale: "Only management and dispatch roles may create work orders; field technicians and customers are not authorised to create them."

  - id: list_sla_policies
    description: "List all SLA policies (admin configuration data)"
    serviceClass: "com.fieldservice.sla.application.SlaPolicyApplicationService"
    serviceMethod: "listPolicies"
    http:
      method: GET
      path: "/api/v1/admin/sla-policies"
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: DENY
      MANAGER:    DENY
      TECHNICIAN: DENY
      CUSTOMER:   DENY
    rationale: "SLA configuration is infrastructure-level data; only ADMIN may read or modify it."

  - id: consume_parts
    description: "Record parts consumed against a work order"
    serviceClass: "com.fieldservice.inventory.application.PartsConsumptionApplicationService"
    serviceMethod: "consumeParts"
    http:
      method: POST
      path: "/api/v1/work-orders/{workOrderId}/parts"
      testPathParams:
        workOrderId: "eeeeeeee-0000-0000-0000-000000000001"
      testBody: '{"partId":"cccccccc-0000-0000-0000-000000000001","quantity":1}'
    permissions:
      ADMIN:      PERMIT
      DISPATCHER: PERMIT
      MANAGER:    PERMIT
      TECHNICIAN: PERMIT
      CUSTOMER:   DENY
    rationale: "Customers may not record parts usage; this is a field-operations action reserved for internal staff."
