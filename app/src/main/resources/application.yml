spring:
  application:
    name: field-service-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/fieldservice}
    username: ${DATASOURCE_USERNAME:fieldservice}
    password: ${DATASOURCE_PASSWORD:fieldservice}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
        envers:
          audit_table_suffix: _aud
          store_data_at_delete: true
          default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://auth.fieldservice.local}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://auth.fieldservice.local/.well-known/jwks.json}

app:
  pagination:
    cursor-hmac-key: ${APP_PAGINATION_CURSOR_HMAC_KEY:change-me-in-production}
    offset-threshold: 20
  idempotency:
    enabled: true
    ttl: 24h
    lease-duration: 60s
    max-body-bytes: 262144
    purge-batch-size: 500
    purge-job-enabled: true
    purge-interval-ms: 900000
  outbox:
    max-payload-bytes: 65536
  api:
    public-base-url: ${APP_API_PUBLIC_BASE_URL:http://localhost:8080}
  auth:
    issuer: ${APP_AUTH_ISSUER:https://auth.fieldservice.local}
    audience: ${APP_AUTH_AUDIENCE:field-service-api}
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:P7D}

ai:
  copilot:
    enabled: false
    daily-cap-per-user: 50
  provider:
    base-url: ${AI_PROVIDER_BASE_URL:https://api.example.ai}
    api-key: ${AI_PROVIDER_API_KEY:}
    allowed-hosts:
      - ${AI_PROVIDER_ALLOWED_HOST:api.example.ai}
    connect-timeout: 2s
    read-timeout: 10s
  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 3
    bulkhead:
      max-concurrent-calls: 16
    time-limiter:
      timeout-duration: 10s
  metrics:
    cost-per-1k-tokens: 0.002

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false
  show-actuator: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  # Explicitly disable sensitive endpoints — env, heapdump and loggers are never exposed
  info:
    enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

---
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  swagger-ui:
    enabled: true
