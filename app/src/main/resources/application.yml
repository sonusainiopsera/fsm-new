spring:
  application:
    name: field-service-api

  # Java 21 virtual threads — enables blocking-style code with high concurrency
  threads:
    virtual:
      enabled: true

  # Fail fast on missing properties rather than silently using defaults
  config:
    import: optional:file:.env[.properties]

  # Stateless JWT — no server-side session
  session:
    store-type: none

  # JPA configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        # Log slow queries for performance monitoring
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 1000
        # Hibernate Envers — audit tables created by Flyway; Hibernate must never create them
        envers:
          audit_table_suffix: _aud
          store_data_at_delete: true
          default_schema: public
          do_not_audit_optimistic_locking_field: true

  # Flyway migrations
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  # Jackson — strict mode prevents mass-assignment attacks
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # OAuth2 Resource Server — configured from environment
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS URI for token signature verification (configured per-environment)
          jwks-uri: ${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}

# AI Gateway — feature flag defaults to OFF; vendor is not yet selected
ai:
  copilot:
    # Master feature flag: when false the gateway short-circuits with 503 before any network call
    enabled: ${AI_COPILOT_ENABLED:false}
    # Maximum AI interactions per user per UTC day; enforced via Redis
    daily-cap-per-user: ${AI_COPILOT_DAILY_CAP:100}
  provider:
    # Base URL for the selected AI provider — no trailing slash
    base-url: ${AI_PROVIDER_BASE_URL:https://api.example.com/v1}
    # Comma-separated list of FQDNs permitted for outbound AI egress (SSRF protection)
    # Leave empty to refuse all calls; never add user-supplied hosts
    allowed-hosts: ${AI_PROVIDER_ALLOWED_HOSTS:}
    connect-timeout: ${AI_PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_PROVIDER_READ_TIMEOUT:10s}
    # Estimated cost per token in USD; used for ai_gateway_estimated_cost_total metric
    cost-per-token: ${AI_PROVIDER_COST_PER_TOKEN:0.00002}

# SpringDoc OpenAPI — expose the JSON contract; disable the interactive UI in all profiles
# (enable swagger-ui per-deployment by setting SPRINGDOC_SWAGGER_UI_ENABLED=true in non-production)
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
  default-produces-media-type: application/json
  # Exclude Actuator endpoints from the generated spec
  paths-to-exclude: /actuator/**

# Pagination defaults — override in production with a strong random secret
app:
  api:
    # Published API version — set at deployment time; defaults to snapshot for local dev
    version: ${API_VERSION:0.1.0-SNAPSHOT}
    # Public base URL for the server entry in the OpenAPI document
    base-url: ${API_PUBLIC_BASE_URL:http://localhost:8080}
  pagination:
    cursor:
      secret: ${APP_PAGINATION_CURSOR_SECRET:dev-cursor-secret-change-in-prod!!}
    keyset:
      threshold: ${APP_PAGINATION_KEYSET_THRESHOLD:20}

  outbox:
    # Maximum serialised payload size in bytes; oversized payloads fail the transaction
    max-payload-bytes: ${APP_OUTBOX_MAX_PAYLOAD_BYTES:65536}
    poller:
      batch-size: ${APP_OUTBOX_POLLER_BATCH_SIZE:100}
      poll-interval-ms: ${APP_OUTBOX_POLLER_INTERVAL_MS:500}
      max-attempts: ${APP_OUTBOX_POLLER_MAX_ATTEMPTS:5}
      backoff-base-ms: ${APP_OUTBOX_POLLER_BACKOFF_BASE_MS:1000}
      backoff-cap-ms: ${APP_OUTBOX_POLLER_BACKOFF_CAP_MS:300000}
      jitter-fraction: ${APP_OUTBOX_POLLER_JITTER_FRACTION:0.2}
      dispatch-timeout-ms: ${APP_OUTBOX_POLLER_DISPATCH_TIMEOUT_MS:30000}

  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER:http://localhost:8080}
      audience: ${AUTH_JWT_AUDIENCE:field-service-api}
      access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL:900}
      rsa-private-key-pem: ${APP_AUTH_JWT_RSA_PRIVATE_KEY_PEM:}
    refresh-token:
      ttl-days: ${AUTH_REFRESH_TOKEN_TTL_DAYS:7}
    lockout:
      max-failures: ${AUTH_LOCKOUT_MAX_FAILURES:5}
      window-seconds: ${AUTH_LOCKOUT_WINDOW_SECONDS:900}

  crypto:
    # AES-256 field encryption key (base64-encoded 32 bytes). Supply via APP_CRYPTO_FIELD_ENCRYPTION_KEY.
    field-encryption-key: ${APP_CRYPTO_FIELD_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    # Envelope encryption blind-index HMAC key (base64-encoded 32 bytes). Supply via APP_CRYPTO_BLIND_INDEX_KEY.
    blind-index-key: ${APP_CRYPTO_BLIND_INDEX_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

  workforce:
    position-retention-days: ${APP_WORKFORCE_POSITION_RETENTION_DAYS:90}

  privacy:
    dsar:
      # SLA window in days — due date = submitted_at + slaDays (BR-26, O7)
      sla-days: ${PRIVACY_DSAR_SLA_DAYS:30}
      # Days remaining below which a request is flagged as at-risk
      at-risk-threshold-days: ${PRIVACY_DSAR_AT_RISK_THRESHOLD_DAYS:5}
      # Maximum presigned download URL validity (never exceeds 300 seconds)
      download-url-expiry-seconds: ${PRIVACY_DSAR_DOWNLOAD_URL_EXPIRY_SECONDS:300}
      # Interval between export assembly job runs in milliseconds (worker profile only)
      export-job-interval-ms: ${PRIVACY_DSAR_EXPORT_JOB_INTERVAL_MS:60000}
    purge:
      # Master kill-switch: must be explicitly enabled after Q7 DPO ratification (AC-7)
      execution-enabled: ${PRIVACY_PURGE_EXECUTION_ENABLED:false}
      # Number of eligible IDs retrieved and disposed per batch
      batch-size: ${PRIVACY_PURGE_BATCH_SIZE:100}
      # Maximum wall-clock seconds per sweep run
      time-budget-seconds: ${PRIVACY_PURGE_TIME_BUDGET_SECONDS:300}
      # Spring cron expression for sweep schedule (worker profile only)
      cron: ${PRIVACY_PURGE_CRON:0 0 2 * * *}
      # Time zone for cut-off instant computation
      zone-id: ${PRIVACY_PURGE_ZONE_ID:UTC}

  portal:
    submission:
      # Default priority for portal-submitted work orders (customers cannot self-escalate)
      default-priority: ${PORTAL_SUBMISSION_DEFAULT_PRIORITY:MEDIUM}
      # Maximum portal submissions per account per rate-limit window
      rate-limit-max: ${PORTAL_RATE_LIMIT_MAX:10}
      # Rate-limit window duration in seconds
      rate-limit-window-seconds: ${PORTAL_RATE_LIMIT_WINDOW_SECONDS:60}

  copilot:
    grounding:
      # Maximum prior work orders to include in AI grounding context
      max-prior-work-orders: ${COPILOT_GROUNDING_MAX_PRIOR_WOS:5}
      # Maximum characters per free-text field before truncation with [TRUNCATED] marker
      max-free-text-chars: ${COPILOT_GROUNDING_MAX_FREE_TEXT_CHARS:2000}
      # Operation ID forwarded to the AI gateway for rate-limit accounting
      operation-id: ${COPILOT_GROUNDING_OPERATION_ID:copilot-suggestion}
    stream:
      # Hard interaction budget in seconds; exceeding it emits degraded and closes the stream
      budget-seconds: ${COPILOT_STREAM_BUDGET_SECONDS:10}
      # Maximum simultaneous copilot streams per authenticated user
      max-concurrent-per-user: ${COPILOT_STREAM_MAX_CONCURRENT:1}

  ai:
    audit:
      # Retention days for COPILOT_QUESTION interactions (indicative — pending compliance ratification)
      copilot-retention-days: ${AI_AUDIT_COPILOT_RETENTION_DAYS:365}
      # Retention days for PHOTO_CAPTION interactions (indicative — pending compliance ratification)
      photo-caption-retention-days: ${AI_AUDIT_PHOTO_CAPTION_RETENTION_DAYS:90}
      # Maximum characters stored for redacted_prompt and response_text; longer values are truncated
      max-text-chars: ${AI_AUDIT_MAX_TEXT_CHARS:4000}
      # Maximum rows deleted per purge-job invocation (worker profile)
      purge-batch-size: ${AI_AUDIT_PURGE_BATCH_SIZE:500}
      # Cron expression for the daily purge job (worker profile); default 03:00 UTC
      purge-cron: ${AI_AUDIT_PURGE_CRON:0 0 3 * * *}

  sla:
    sweep:
      # Interval between SLA risk sweep ticks in milliseconds (worker profile only)
      tick-interval-ms: ${APP_SLA_SWEEP_TICK_INTERVAL_MS:60000}
      # Maximum work orders evaluated per sweep batch
      batch-size: ${APP_SLA_SWEEP_BATCH_SIZE:500}
      # Set to false to disable the advisory lock (tests with a single context)
      lock-enabled: ${APP_SLA_SWEEP_LOCK_ENABLED:true}
      # Master kill-switch: set to false to pause the sweep without removing the bean
      enabled: ${APP_SLA_SWEEP_ENABLED:true}

  cert:
    sweep:
      # Spring cron expression for the daily certification expiry sweep (worker profile only)
      cron: ${APP_CERT_SWEEP_CRON:0 0 2 * * *}
      # Days before expiry that triggers a WARNING alert (default 30)
      warning-window-days: ${APP_CERT_SWEEP_WARNING_WINDOW_DAYS:30}
      # Days before expiry that triggers an URGENT alert (default 7)
      urgent-window-days: ${APP_CERT_SWEEP_URGENT_WINDOW_DAYS:7}
      # Maximum certifications evaluated per sweep batch
      batch-size: ${APP_CERT_SWEEP_BATCH_SIZE:500}
      # Master kill-switch: set to false to pause the sweep without redeploying
      enabled: ${APP_CERT_SWEEP_ENABLED:true}
      # Set to false to skip the advisory lock in test environments
      lock-enabled: ${APP_CERT_SWEEP_LOCK_ENABLED:true}

  idempotency:
    # How long an IN_PROGRESS record holds its lease before it can be reclaimed (crash recovery)
    lease-duration: ${APP_IDEMPOTENCY_LEASE_DURATION:PT30S}
    # How long a completed response is retained for replay after the request completes
    retention-duration: ${APP_IDEMPOTENCY_RETENTION_DURATION:PT24H}
    # When true, mutating requests without an Idempotency-Key header are rejected with 422
    require-key: ${APP_IDEMPOTENCY_REQUIRE_KEY:false}
    # Maximum response body size stored for replay; larger responses are marked NON_REPLAYABLE
    max-body-bytes: ${APP_IDEMPOTENCY_MAX_BODY_BYTES:65536}
    # Maximum number of records deleted per purge-job invocation
    purge-batch-size: ${APP_IDEMPOTENCY_PURGE_BATCH_SIZE:500}
    # Interval between purge-job runs in milliseconds
    purge-interval: ${APP_IDEMPOTENCY_PURGE_INTERVAL:300000}

dispatch:
  eligibility:
    # Maximum number of active technicians evaluated per dispatch eligibility request
    candidate-page-size: ${DISPATCH_ELIGIBILITY_CANDIDATE_PAGE_SIZE:200}

# Actuator — health and Prometheus only; all other endpoints disabled
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  # Sensitive endpoints explicitly disabled in all profiles
  endpoint.env.enabled: false
  endpoint.heapdump.enabled: false
  endpoint.loggers.enabled: false

# Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n"
  level:
    root: INFO
    com.fieldservice: INFO
    org.springframework.security: INFO
    # Enable SQL logging for development — disable in production
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

---
# API profile — HTTP API deployable
spring:
  config:
    activate:
      on-profile: api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldservice}
    username: ${DB_USERNAME:fieldservice}
    password: ${DB_PASSWORD:fieldservice}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
  http2:
    enabled: true

---
# Worker profile — async worker deployable
spring:
  config:
    activate:
      on-profile: worker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldservice}
    username: ${DB_USERNAME:fieldservice}
    password: ${DB_PASSWORD:fieldservice}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

---
# Test profile — used by integration tests with Testcontainers
spring:
  config:
    activate:
      on-profile: test

  # Disable Redis autoconfiguration — no Redis in test environment; the AI gateway
  # is replaced by FakeAiGatewayAdapter and RedisUsageCapService is not activated
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  flyway:
    locations: classpath:db/migration,classpath:db/fixtures

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Show SQL in test output for predicate assertion tests
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
