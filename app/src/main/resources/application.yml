spring:
  application:
    name: field-service-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/fieldservice}
    username: ${DATASOURCE_USERNAME:fieldservice}
    password: ${DATASOURCE_PASSWORD:fieldservice}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
        envers:
          audit_table_suffix: _aud
          store_data_at_delete: true
          default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://auth.fieldservice.local}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://auth.fieldservice.local/.well-known/jwks.json}

app:
  pagination:
    cursor-hmac-key: ${APP_PAGINATION_CURSOR_HMAC_KEY:change-me-in-production}
    offset-threshold: 20
  idempotency:
    enabled: true
    ttl: 24h
    lease-duration: 60s
    max-body-bytes: 262144
    purge-batch-size: 500
    purge-job-enabled: true
    purge-interval-ms: 900000
  outbox:
    max-payload-bytes: 65536
    batch-size: 100
    max-attempts: 5
    backoff-base-ms: 1000
    backoff-cap-ms: 300000
    jitter-fraction: 0.2
    dispatch-timeout-ms: 10000
    poll-interval-ms: 500
    poll-initial-delay-ms: 0
  inventory:
    parts-cache:
      ttl-seconds: 60
    reconciliation:
      enabled: true
      interval-ms: 60000
  analytics:
    enabled: true
    worker-interval-ms: 1000
    retention-purge-interval-ms: 3600000
  csat:
    response-window-days: 7
  api:
    public-base-url: ${APP_API_PUBLIC_BASE_URL:http://localhost:8080}
  auth:
    issuer: ${APP_AUTH_ISSUER:https://auth.fieldservice.local}
    audience: ${APP_AUTH_AUDIENCE:field-service-api}
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:P7D}

geo:
  travel:
    provider:
      base-url: ${TRAVEL_PROVIDER_BASE_URL:https://maps.example.com}
      api-key: ${TRAVEL_PROVIDER_API_KEY:}
      allowed-hosts:
        - ${TRAVEL_PROVIDER_ALLOWED_HOST:maps.example.com}
      connect-timeout: 2s
      read-timeout: 1500ms
      travel-mode: car
      average-speed-kph: 50.0
    resilience:
      time-limiter-timeout: 1500ms
      max-attempts: 2
      circuit-breaker-failure-rate-threshold: 50
      circuit-breaker-window-size: 20
      circuit-breaker-wait-duration: 30s
      circuit-breaker-half-open-calls: 3
    cache:
      ttl-seconds: 300
      coordinate-precision-decimal-places: 4

ai:
  copilot:
    enabled: false
    daily-cap-per-user: 50
    grounding:
      max-prior-work-orders: 5
      max-description-chars: 2000
      max-fault-notes-chars: 500
  provider:
    base-url: ${AI_PROVIDER_BASE_URL:https://api.example.ai}
    api-key: ${AI_PROVIDER_API_KEY:}
    allowed-hosts:
      - ${AI_PROVIDER_ALLOWED_HOST:api.example.ai}
    connect-timeout: 2s
    read-timeout: 10s
  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 3
    bulkhead:
      max-concurrent-calls: 16
    time-limiter:
      timeout-duration: 10s
  metrics:
    cost-per-1k-tokens: 0.002
  audit:
    # Indicative retention defaults — pending ratification by Data Governance.
    # These values MUST be overridden in production via environment-specific config.
    copilot-retention-days: 365
    photo-caption-retention-days: 90
    max-prompt-chars: 4096
    max-response-chars: 4096
    purge-job-batch-size: 500
    purge-cron: "0 30 2 * * *"

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false
  show-actuator: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  # Explicitly disable sensitive endpoints — env, heapdump and loggers are never exposed
  info:
    enabled: false

app:
  privacy:
    purge:
      execution-enabled: false
      batch-size: 200
      run-budget: PT10M
      cron: "0 0 2 * * *"
      lock-lease-secs: 660
      audit-floor-days: 365
      zone: UTC
    consistency-check:
      enabled: true
    dsar:
      request-due-days: P30D
      at-risk-threshold-days: 7
      download-token-validity-secs: 300
      export-cron: "0 */5 * * * *"
      export-lock-lease-secs: 300
      zone: UTC
      token-secret: ${DSAR_TOKEN_SECRET:change-me-in-production}

  privacy:
    masking:
      enabled: true
      # Unclassified fields default to RESTRICTED (most restrictive) if provider returns empty
      unclassified-default: RESTRICTED
    anonymise:
      # Non-production-only secret for deterministic HMAC pseudonymisation
      seed: ${APP_ANONYMISE_SEED:change-me-non-production-seed-only}

  encryption:
    # AES-256 data-encryption key (Phase 1 global key and LocalStubSubjectKeyManager master key).
    # Production: inject from secrets manager.  Fallback is all-zeros test key.
    data-key-base64: ${APP_ENCRYPTION_DATA_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    # HMAC-SHA-256 blind-index key — MUST be distinct from data-key-base64.
    # Production: inject from secrets manager.  Fallback is all-zeros test key.
    blind-index-key-base64: ${APP_ENCRYPTION_BLIND_INDEX_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    # Key cache configuration
    key-cache:
      max-entries: 512
      ttl-seconds: 900

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    accesslog:
      enabled: false
      # When enabled, use %U (URI without query string) so SSE stream ticket values
      # in query parameters are never written to access logs.
      # Example production pattern: %h %l %u %t "%m %U %H" %s %b
      pattern: '%h %l %u %t "%m %U %H" %s %b'

audit:
  trail:
    # Minimum retention in days. One-year minimum; 24-month target recommended.
    # This value drives query filters and documentation — no hard-coded windows allowed.
    retention-days: 730
    # Row ceiling below which exports are synchronous. Above this: async handle returned.
    export-row-ceiling: 1000

duplicate:
  window-hours: 72
  min-signature-overlap: 0.3

sla:
  stream:
    max-per-user: 3
    max-global: 200
    heartbeat-interval-seconds: 15
    replay-buffer-capacity: 500

---
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  swagger-ui:
    enabled: true
