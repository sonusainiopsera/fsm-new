spring:
  config:
    activate:
      on-profile: worker

app:
  sla:
    sweep:
      tick-ms: 60000
      batch-size: 500
      enabled: true
  certification:
    alert-sweep:
      cron: "0 0 6 * * *"       # Daily at 06:00 UTC
      warning-window-days: 30
      urgent-window-days: 7
      batch-size: 200
      enabled: true
      lock-lease-secs: 300
  readiness:
    snapshot:
      cron: "0 0 7 * * MON"     # Weekly Monday at 07:00 UTC
    warning-window-days: 14

  privacy:
    dsar:
      export-cron: "0 */5 * * * *"
      export-lock-lease-secs: 300
    purge:
      # Execution remains disabled until Q7 retention periods are ratified by the DPO.
      # Set to true only after DPO sign-off and operational runbook is approved.
      execution-enabled: false
      cron: "0 0 2 * * *"
      run-budget: PT10M
      batch-size: 200
      lock-lease-secs: 660
